name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            workloads/ldk

      - name: Install taplo
        run: curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo

      - name: Check TOML formatting
        run: taplo format --check

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path workloads/ldk/Cargo.toml

      - name: Check order of BOLT message type constants
        run: scripts/check-bolt-msg-type-order.sh

      - name: Run Clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --all-targets --manifest-path workloads/ldk/Cargo.toml -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build with nyx feature
        run: cargo build --verbose --features nyx

      - name: Run tests
        run: cargo test --verbose

      - name: Spec-derived seed pipeline gate
        run: |
          md=smite-requirements/data/bolt02-peer-protocol.md
          seeds=$(mktemp -d)
          cargo run --release -p smite-requirements --bin smite-requirements -- emit "$md" "$seeds" | tee emit.log
          # The corpus count is pinned: a converter change that alters it
          # must update this number (and the README) deliberately.
          expected=95
          actual=$(sed -n 's/^emit: \([0-9]*\) seed files.*/\1/p' emit.log)
          [ "$actual" = "$expected" ] || { echo "seed count drifted: expected $expected, got $actual"; exit 1; }
          cargo run --release -p smite-requirements --bin verify_seeds "$seeds"
          # Artifact drift gate: the checked-in requirements JSON must match
          # the checked-in BOLT source.
          cargo run --release -p smite-requirements --bin smite-requirements -- verify "$md" smite-requirements/data/bolt02-requirements.json
